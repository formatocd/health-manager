name: Publish Docker Image CI/CD

# Este flujo se ejecutará automáticamente cada vez que se haga un 'push' a la rama principal.
on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_publish:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx (Motor avanzado)
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Autenticación en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Construir y Publicar Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Etiquetamos como 'latest' y también con el hash del commit para trazabilidad
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/health-manager:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/health-manager:${{ github.sha }}